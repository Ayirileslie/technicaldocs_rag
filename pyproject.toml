[build-system]
requires=["hatchling"]
build-backend ="hatchling.build"

[project]
name = "techdoc-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayiri", email = "kperegbeyiayiri@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "weaviate-client>=4.9",
    "sentence-transformers>=3.0",
    "groq>=0.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]


[project.scripts]
techdocs-rag = "techdocs_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techdocs_rag"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
